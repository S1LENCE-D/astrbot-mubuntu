#!/bin/sh
# astrbot-mubuntu 配置（依赖 Mubuntu / magisk_ubuntu）
# 依赖：已安装 magisk_ubuntu (Mubuntu for KernelSU)，其 Ubuntu 环境可用

# mubuntu 入口命令（备用入口；system/bin 路径优先，这里用数据目录稳定入口）
MUBUNTU=/data/adb/mubuntu/bin/mubuntu

# Ubuntu rootfs 实际位置：
# 官方默认在 /data/adb/mubuntu/rootfs；但部分环境实测根目录直接在 /data/adb/mubuntu
# 自动探测：以存在 /etc 的目录为准
MUBUNTU_RFS=/data/adb/mubuntu/rootfs
if [ -d /data/adb/mubuntu/etc ] && [ ! -d /data/adb/mubuntu/rootfs/etc ]; then
    MUBUNTU_RFS=/data/adb/mubuntu
fi

# 容器内路径
ASTROOT=/opt/astrbot
# AstrBot 面板端口
PANEL_PORT=6185
# 开机自启（含 mubuntu autostart + 拉 AstrBot）
AUTO_START=true
